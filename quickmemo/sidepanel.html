<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickMemo</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="sidepanel.js"></script>
  <script type="module" src="list-splitter.js"></script>
</head>
<body>
  <header class="top">
    <div class="title-bar">
      <h1 id="page-title">メモ</h1>
      <button id="new-note" class="primary" type="button" disabled>＋ 新規メモ</button>
      <button id="close-settings" type="button" hidden>設定タブを閉じる</button>
    </div>
    <div class="settings-actions">
      <span id="library-name">保存先未設定</span>
      <button id="open-settings" type="button" aria-label="保存先・取り込み設定を開く" title="保存先・取り込み設定を開く">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
          <path d="M10 3h4l.6 2.8 1.7 1 2.7-.9 2 3.4-2.1 1.9v1.6l2.1 1.9-2 3.4-2.7-.9-1.7 1L14 21h-4l-.6-2.8-1.7-1-2.7.9-2-3.4 2.1-1.9v-1.6L3 9.3l2-3.4 2.7.9 1.7-1Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button id="reload" type="button" disabled>再読み込み</button>
      <button id="authorize-folder" type="button" hidden>アクセスを許可</button>
      <div id="file-actions" hidden>
        <button id="choose-folder" type="button">保存先を選ぶ</button>
        <button id="import-markdown" type="button" disabled>Markdown フォルダを取り込む</button>
        <button id="import-vivaldi" type="button" disabled>Vivaldi Notes を取り込む</button>
        <button id="export-backup" type="button" disabled>JSON 書き出し</button>
        <button id="import-backup" type="button" disabled>JSON から復元</button>
      </div>
    </div>
    <p id="folder-help" class="notice" hidden>書類（Documents）に「メモ」などのフォルダを作るか、使いたい既存のフォルダを選んでください。</p>
    <p id="notice" class="notice" role="status"></p>
    <p id="scan-warning" class="notice" role="status" hidden></p>
    <p id="clip-count" class="notice" role="status" hidden></p>
    <div id="drafts" class="folder-bar" hidden>
      <select id="draft-list" aria-label="未保存の下書き"></select>
      <button id="open-draft" type="button">下書きを開く</button>
    </div>
  </header>
  <main>
    <section class="library" aria-label="メモ一覧">
      <div id="note-views" class="note-views" role="group" aria-label="表示するメモ">
        <button type="button" data-area="active" aria-pressed="true">メモ</button>
        <button type="button" data-area="archive" aria-pressed="false">アーカイブ</button>
        <button type="button" data-area="trash" aria-pressed="false">ゴミ箱</button>
      </div>
      <input id="search" type="search" placeholder="メモを検索" aria-label="メモを検索" disabled>
      <div id="folder-controls" class="folder-bar">
        <select id="folders" aria-label="表示するフォルダ" disabled>
          <option value="*">すべてのフォルダ</option>
        </select>
        <button id="new-folder" type="button" disabled>＋ フォルダ</button>
      </div>
      <div class="selection-bar">
        <button id="selection-mode" type="button" aria-pressed="false" disabled>複数選択</button>
        <button id="select-visible" type="button" hidden>表示中をすべて選択</button>
        <span id="selection-count" role="status" hidden></span>
        <button id="selection-action" type="button" hidden>ゴミ箱へ移動</button>
      </div>
      <details id="selection-errors" class="notice" hidden>
        <summary>処理できなかったメモ</summary>
        <ul id="selection-error-list"></ul>
      </details>
      <div id="note-list-pane" class="notes-pane">
        <ul id="notes" class="notes"></ul>
        <p id="list-empty" class="empty" hidden></p>
      </div>
    </section>
    <div id="list-splitter" class="list-splitter" role="separator" tabindex="0"
      aria-label="メモ一覧の高さ" aria-orientation="horizontal" aria-controls="note-list-pane"></div>
    <section class="editor" aria-label="メモの編集">
      <p id="editor-empty" class="empty">保存先フォルダを選んでください。</p>
      <div id="note-editor" hidden>
        <input id="title" type="text" placeholder="タイトル" aria-label="タイトル" spellcheck="false">
        <div class="source">
          <input id="url" type="text" inputmode="url" placeholder="出典URL" aria-label="出典URL" spellcheck="false">
          <a id="open-source" target="_blank" rel="noopener noreferrer" hidden>開く ↗</a>
        </div>
        <div id="body" class="body-editor"></div>
        <div class="editor-footer">
          <span id="save-status" role="status"></span>
          <button id="retry-save" type="button" hidden>再保存</button>
          <button id="save-copy" type="button" hidden>コピーを保存</button>
          <button id="download-draft" type="button" hidden>Markdownをダウンロード</button>
          <button id="close-draft" type="button" hidden>後で続ける</button>
          <button id="archive-note" type="button" hidden>アーカイブ</button>
          <button id="trash-note" type="button" hidden>ゴミ箱へ移動</button>
          <button id="restore-note" type="button" hidden>元に戻す</button>
          <button id="purge-note" class="danger" type="button" hidden>完全に削除</button>
        </div>
      </div>
    </section>
  </main>
  <dialog id="folder-dialog">
    <form method="dialog">
      <label for="folder-name">新しいフォルダ名</label>
      <input id="folder-name" type="text" required maxlength="50" autocomplete="off">
      <div class="dialog-actions">
        <button type="submit" value="cancel" formnovalidate>キャンセル</button>
        <button type="submit" value="create" class="primary">作成</button>
      </div>
    </form>
  </dialog>
  <dialog id="purge-dialog" aria-labelledby="purge-heading" aria-describedby="purge-message">
    <form method="dialog">
      <h2 id="purge-heading">メモを完全に削除</h2>
      <p id="purge-message"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" autofocus>キャンセル</button>
        <button type="submit" value="purge" class="primary">完全に削除</button>
      </div>
    </form>
  </dialog>
  <input id="import-file" type="file" hidden>
</body>
</html>
